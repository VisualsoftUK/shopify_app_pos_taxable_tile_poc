version: v1.0
name: Promote to Internal
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
blocks:
  - name: Build
    task:
      secrets:
        # Secret to allow pulling Visualsoft code from GitHub
        - name: Github
        # Secret to allow connecting to the dockyard container registry
        - name: dockyard - shopify_app_pos_taxable_tile_poc 
        # Secret to allow creating a new release in the sentry project
        - name: shopify_app_pos_taxable_tile_poc - Sentry
        # Secrets relating to this specific app, including $SHOPIFY_FLAG_CLIENT_ID used for the Shopify CLI release command
        - name: Shopify App - POS Taxable Tile PoC (Testing)
        # Secret to allow sending a failure notification to Google Chat
        - name: Semaphore Build Failure Webhook
      prologue:
        commands:
          # Checkout the files from GitHub
          - 'checkout'
          # Restore Composer (no dev) and npm deps; composer uses lockfile + branch fallbacks, npm uses package-lock checksum only
          - "cache restore composer-prod-$(checksum composer.lock),composer-prod-$SEMAPHORE_GIT_BRANCH,composer-prod-main"
          - "cache restore npm-$(checksum package-lock.json)"
          # Create a date based tag for version tracking
          - 'export DOCKER_DATE_TAG=$(date "+%Y%m%d%H%M%S")'
          # Install the sentry cli tool
          - 'sudo curl -L -o /usr/local/bin/sentry-cli https://github.com/getsentry/sentry-cli/releases/download/2.19.4/sentry-cli-Linux-x86_64 && sudo chmod 0755 /usr/local/bin/sentry-cli'
          # Create a readable date string for documentation build date
          - 'export APP_BUILD_DATE=$(date "+%H:%M, %a %d %b %Y")'
          # Create a version from either Git tag or Branch to include in documentation
          - export APP_BUILD_VERSION=${SEMAPHORE_GIT_TAG_NAME:=$SEMAPHORE_GIT_BRANCH}
      epilogue:
        on_fail:
          commands:
            # Script exits without sending unless the git ref maps to testing, acceptance, or production
            - if [ -f .semaphore/build_failure_notification.sh ]; then bash .semaphore/build_failure_notification.sh; else echo "Failure notification script not present in .semaphore."; fi
      jobs:
        - name: Build docker image
          commands:
            # Login to the dockyard container registry using the variables from the secret
            - 'echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin $DOCKER_URI'
            # Using the Visualsoft created php 8.5 container
            # Run composer install without dev packages, using the GitHub secret
            # We mount the local directory to /app inside the container, so any installed packages are stored on the local disk
            - 'docker run -e GITHUB_ACCESS_TOKEN=$GITHUB_ACCESS_TOKEN --rm -v "$PWD:/app:Z" $DOCKER_URI/vs-platform/php-cli-8.5:latest  composer-install'
            # Create shopify.app.toml files
            - './bin/build-shopify-config.sh'
            # Move the extension files to the correct environment
            - 'chmod +x ./bin/swap-extension-toml-environments.sh'
            - './bin/swap-extension-toml-environments.sh ${APP_BUILD}'
            # Install local build assets
            - 'docker run --rm -v "$PWD:/app:Z" $DOCKER_URI/vs-platform/shopify-app-build:latest npm install'
            # Build local Shopify extension assets
            - 'docker run --rm -v "$PWD:/app:Z" $DOCKER_URI/vs-platform/shopify-app-build:latest npm run shopify-ext-prod'
            # Run shopify app build perform a theme extension check (aliased through build)
            - 'docker run --rm -v "$PWD:/app:Z" $DOCKER_URI/vs-platform/shopify-app-build:latest npm run shopify-build'
            # Create a new release in sentry using the date based tag - the secrets are used automatically
            - 'sentry-cli releases new $DOCKER_DATE_TAG'
            # Set the release to use all git commits up to this point - the secrets are used automatically
            - 'sentry-cli releases set-commits $DOCKER_DATE_TAG --auto --ignore-missing'
            # Using the Visualsoft node 22 container
            # Run npm clean install and npm run prod
            # Again, we mount the local directory to /app inside the container, so any installed node packages / built files are stored on the local disk
            - 'docker run --rm -v "$PWD:/app:Z" $DOCKER_URI/vs-platform/node-22:latest npm-run-prod'
            - "cache store composer-prod-$(checksum composer.lock),composer-prod-$SEMAPHORE_GIT_BRANCH,composer-prod-main vendor"
            - "cache store npm-$(checksum package-lock.json) node_modules"
            # Build the Nginx container using the Dockerfile, specifying the APP_VERSION
            - 'docker build -t ${PROJECT}/nginx:semaphore --file=docker/nginx/Dockerfile .'
            # Give the built container a tag using the date based tag
            - 'docker tag ${PROJECT}/nginx:semaphore $DOCKER_URI/${PROJECT}/nginx:${DOCKER_DATE_TAG}'
            # Give the built container a tag of latest-testing
            - 'docker tag ${PROJECT}/nginx:semaphore $DOCKER_URI/${PROJECT}/nginx:latest-${APP_BUILD}'
            # Give the built container a tag using the release version
            - 'docker tag ${PROJECT}/nginx:semaphore $DOCKER_URI/${PROJECT}/nginx:${APP_BUILD_VERSION}'
            # Build the PHP-FPM container using the Dockerfile, specifying the APP_VERSION, APP_BUILD, the sentry ref and the Sentry secrets - so we can mark it as deployed
            - 'docker build -t ${PROJECT}/php-fpm:semaphore --build-arg APP_VERSION=$DOCKER_DATE_TAG --build-arg APP_BUILD=$APP_BUILD --build-arg SENTRY_URL=$SENTRY_URL --build-arg SENTRY_ORG=$SENTRY_ORG --build-arg SENTRY_REF=$DOCKER_DATE_TAG --build-arg SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN --build-arg APP_BUILD_VERSION=$APP_BUILD_VERSION --file=docker/php-fpm/Dockerfile .'
            # Give the built container a tag using the date based tag
            - 'docker tag ${PROJECT}/php-fpm:semaphore $DOCKER_URI/${PROJECT}/php-fpm:${DOCKER_DATE_TAG}'
            # Give the built container a tag of latest-testing
            - 'docker tag ${PROJECT}/php-fpm:semaphore $DOCKER_URI/${PROJECT}/php-fpm:latest-${APP_BUILD}'
            # Give the built container a tag using the release version
            - 'docker tag ${PROJECT}/php-fpm:semaphore $DOCKER_URI/${PROJECT}/php-fpm:${APP_BUILD_VERSION}'
            # Build the PHP-CLI container using the Dockerfile, specifying the APP_VERSION, APP_BUILD
            - 'docker build -t ${PROJECT}/php-cli:semaphore --build-arg APP_VERSION=$DOCKER_DATE_TAG --build-arg APP_BUILD=$APP_BUILD --build-arg APP_BUILD_VERSION=$APP_BUILD_VERSION --file=docker/php-cli/Dockerfile .'
            # Give the built container a tag using the date based tag
            - 'docker tag ${PROJECT}/php-cli:semaphore $DOCKER_URI/${PROJECT}/php-cli:${DOCKER_DATE_TAG}'
            # Give the built container a tag of latest-testing
            - 'docker tag ${PROJECT}/php-cli:semaphore $DOCKER_URI/${PROJECT}/php-cli:latest-${APP_BUILD}'
            # Give the built container a tag using the release version
            - 'docker tag ${PROJECT}/php-cli:semaphore $DOCKER_URI/${PROJECT}/php-cli:${APP_BUILD_VERSION}'
            # Build the a Node 22 container for Shopify CLI release command run using the Dockerfile, passing in some secets for the
            - 'docker build -t ${PROJECT}/shopify-app-release:semaphore --build-arg SHOPIFY_CLI_PARTNERS_TOKEN=$SHOPIFY_CLI_PARTNERS_TOKEN --build-arg SHOPIFY_FLAG_VERSION=$DOCKER_DATE_TAG --build-arg SHOPIFY_FLAG_CLIENT_ID=$SHOPIFY_FLAG_CLIENT_ID --file=docker/shopify-app-release/Dockerfile .'
            # Deploy new version - the version will be released upon
            # successful deployment of the shopify-app-release container
            - 'docker run --rm -v "$PWD:/app:Z" -e SHOPIFY_CLI_PARTNERS_TOKEN=$SHOPIFY_CLI_PARTNERS_TOKEN -e SHOPIFY_FLAG_VERSION=$DOCKER_DATE_TAG -e SHOPIFY_FLAG_CLIENT_ID=$SHOPIFY_FLAG_CLIENT_ID $DOCKER_URI/vs-platform/shopify-app-build:latest shopify app deploy --version=$DOCKER_DATE_TAG --no-release'
            # Give the built container a tag using the date based tag
            - 'docker tag ${PROJECT}/shopify-app-release:semaphore $DOCKER_URI/${PROJECT}/shopify-app-release:${DOCKER_DATE_TAG}'
            # Give the built container a tag of latest-testing
            - 'docker tag ${PROJECT}/shopify-app-release:semaphore $DOCKER_URI/${PROJECT}/shopify-app-release:latest-${APP_BUILD}'
            # Give the built container a tag using the release version
            - 'docker tag ${PROJECT}/shopify-app-release:semaphore $DOCKER_URI/${PROJECT}/shopify-app-release:${APP_BUILD_VERSION}'
            # Push the Nginx container up to dockyard with all created tags
            - 'docker push $DOCKER_URI/${PROJECT}/nginx --all-tags'
            # Push the PHP-FPM container up to dockyard with all created tags
            - 'docker push $DOCKER_URI/${PROJECT}/php-fpm --all-tags'
            # Push the PHP-CLI container up to dockyard with all created tags
            - 'docker push $DOCKER_URI/${PROJECT}/php-cli --all-tags'
            # Push the Shopify CLI Release command container up to dockyard with all created tags
            - 'docker push $DOCKER_URI/${PROJECT}/shopify-app-release --all-tags'
            # Finalise the sentry release
            - 'sentry-cli releases finalize $DOCKER_DATE_TAG'
      env_vars:
        # Specify the build version of the app
        - name: APP_BUILD
          value: internal
        # Set a variable for the dockyard namespace
        - name: PROJECT
          value: shopify_app_pos_taxable_tile_poc
    dependencies: []
