services:
    nginx:
        image: 'shopify-app-eat-in-tile-poc/nginx'
        build:
            context: .
            dockerfile: ./docker/nginx/Dockerfile
        environment:
            - NGINX_ENABLE_REVERB=1
            - REVERB_PORT=${REVERB_SERVER_PORT:-8088}
        volumes:
            - ${MOUNT_DIR:-./public}:/app:rw
        depends_on:
            - php-fpm
            - reverb
        ports:
            - ${APP_PORT:-80}:80
        restart: always
        networks:
            - local_development
            - default

    php-fpm:
        image: 'shopify-app-eat-in-tile-poc/php-fpm'
        build:
            context: .
            dockerfile: ./docker/php-fpm/Dockerfile
        env_file:
            - .env
        volumes:
            - ${MOUNT_DIR:-.}:/app:rw
        restart: always
        networks:
            - local_development
            - default

    php-cli_jobs:
        image: 'shopify-app-eat-in-tile-poc/php-cli'
        build:
            context: .
            dockerfile: ./docker/php-cli/Dockerfile
        command:
            php artisan queue:work --queue=default,app_pricing,app_usage_metrics,mantle_usage_metrics
        env_file:
            - .env
        volumes:
            - ${MOUNT_DIR:-.}:/app:rw
        depends_on:
            - php-fpm
        restart: always
        networks:
            - local_development
            - default

    php-cli:
        image: 'shopify-app-eat-in-tile-poc/php-cli'
        build:
            context: .
            dockerfile: ./docker/php-cli/Dockerfile
        command:
            php artisan schedule:work
        env_file:
            - .env
        volumes:
            - ${MOUNT_DIR:-.}:/app:rw
        depends_on:
            - php-fpm
        restart: always
        networks:
            - local_development
            - default

    reverb:
        image: 'shopify-app-eat-in-tile-poc/reverb'
        build:
            context: .
            dockerfile: ./docker/reverb/Dockerfile
        # Local: skip `optimize` so a mounted bootstrap/cache does not break Herd/phpunit.
        # Production image still runs optimize via docker/reverb/Dockerfile command.sh.
        command: php artisan reverb:start --debug
        environment:
            - REVERB_PORT=${REVERB_SERVER_PORT:-8088}
        env_file:
            - .env
        volumes:
            - ${MOUNT_DIR:-.}:/app:rw
        depends_on:
            - redis
        restart: always
        networks:
            - local_development
            - default

    redis:
        image: 'dockyard.visualsoft.io/vs-platform/redis-cs:latest'
        ports:
            - ${HOST_REDIS_PORT:-6379}:6379
        environment:
            - DEVELOPERMODE=1
            - STANDALONEMODE=1
            - REDISMAXMEMORY=10mb
            - REDISPORT=6379
            - DEBUGMODE=0
        volumes:
             - redisstorage:/visualsoft/redis:rw
        restart: always
        networks:
            - local_development
            - default

volumes:
    mysql_data:
    redisstorage:

networks:
    default:
    local_development:
        external: true
