# Trigger: Issue labels → Lifecycle Implement / Project Status
#
# Manual override path. Auto-implement uses `auto-implement-eligible` and
# dispatches trigger-lifecycle-implement.yml from post-epic / refine-gate.
#
# Project Status: `auto-implement-ineligible` → Planned,
# `implementation-complete` → Implementation.

name: On Issue Labeled — Implement

on:
  issues:
    types: [labeled]

concurrency:
  group: lifecycle-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ready-for-implementation'
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/lifecycle-implement.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}

  sync-project-status:
    if: >-
      contains(
        fromJSON('["auto-implement-ineligible","implementation-complete"]'),
        github.event.label.name
      )
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/project-status-sync.yml@main
    with:
      project_org: ${{ github.repository_owner }}
      project_number: ${{ vars.PROJECT_NUMBER }}
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
