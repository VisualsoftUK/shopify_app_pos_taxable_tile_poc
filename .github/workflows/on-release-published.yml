# Trigger: Release Published → Move Issues to Live / Acceptance
#
# Calls the centralised workflow to find merged PRs since the previous
# release and move their linked issues to "Live" (production) or
# "On acceptance environment" (pre-release). Publishing a draft
# pre-release emits `published`, not `prereleased`. `published` also
# fires for a stable release. `release-to-live.yml` skips drafts and
# chooses Live vs "On acceptance environment" from
# `github.event.release.prerelease`. `release-summary.yml` already
# skips prereleases.

name: On Release Published

on:
  release:
    types: [published]

jobs:
  move-issues-to-live:
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/release-to-live.yml@v0.16.0
    with:
      project_org: VisualsoftUK
      project_number: ${{ vars.PROJECT_NUMBER }}
      status_value: "Live"
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  release-summary:
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/release-summary.yml@v0.13.0
    with:
      app_description: ${{ vars.APP_DESCRIPTION }}
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
