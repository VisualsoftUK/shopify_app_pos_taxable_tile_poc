name: Trigger Translation

on:
  issue_comment:
    types: [created]

jobs:
  trigger-bot:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '!translate-this-pr') }}
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/translate-locales.yml@v0.13.0
    secrets: inherit
