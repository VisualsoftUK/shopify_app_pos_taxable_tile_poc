# Trigger: Pull Request events → Codacy Autofix / Project Status
#
# Auto path after Implementation Agent triggers Codacy AI Reviewer.
# Prefer pull_request_review.submitted (one run per Codacy review).
#
# Slash path `/codacy fix` / `/codacy review` lives in on-issue-comment.yml.
#
# Project Status: review requested → In peer review;
# PR merged → On testing environment.

name: On Pull Request Review

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [review_requested, closed]

jobs:
  codacy-autofix:
    if: >-
      github.event_name == 'pull_request_review' &&
      startsWith(github.event.pull_request.head.ref, 'cursor/') &&
      contains(
        fromJSON('["codacy-production[bot]","codacy[bot]"]'),
        github.event.review.user.login
      )
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/codacy-autofix.yml@main
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  sync-project-status:
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.event.action == 'review_requested' ||
        (
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true
        )
      )
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/project-status-sync.yml@main
    with:
      project_org: ${{ github.repository_owner }}
      project_number: ${{ vars.PROJECT_NUMBER }}
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
