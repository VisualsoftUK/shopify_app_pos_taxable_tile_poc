# Trigger: Issue Opened → Add to Project + Lifecycle Intake
#
# Calls centralised workflows to:
#   1. Add the issue to the VS Labs Master Project and set priority.
#   2. Start the intake process for the issue.
#
# Native Issue Type DevOps is excluded from intake on issues.opened;
# devops-notify comments @VisualsoftUK/sysadmins instead. Add-to-project
# still runs so DevOps issues appear on the org board.

name: On Issue Opened

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: string
  repository_dispatch:
    types: [lifecycle-intake]

concurrency:
  group: lifecycle-${{ github.repository }}-${{ github.event.issue.number || github.event.client_payload.issue_number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  add-to-project:
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/issue-to-project.yml@main
    with:
      project_org: VisualsoftUK
      project_number: ${{ vars.PROJECT_NUMBER }}
      issue_number: ${{ github.event.issue.number || inputs.issue_number || github.event.client_payload.issue_number }}
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  intake:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.type.name != 'DevOps'
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/lifecycle-intake.yml@main
    with:
      issue_number: ${{ github.event.issue.number || inputs.issue_number || github.event.client_payload.issue_number }}
      app_description: ${{ vars.APP_DESCRIPTION }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  devops-notify:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.type.name == 'DevOps'
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/devops-issue-opened.yml@main
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
