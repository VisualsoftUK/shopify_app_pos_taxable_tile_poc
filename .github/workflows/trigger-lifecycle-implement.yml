# Trigger: Lifecycle Implement (dispatch only)
#
# Thin wrapper. Logic lives in lifecycle-implement.yml.
# Manual / slash path, or auto-dispatch when `auto-implement-eligible` is applied
# after refine-gate (see on-issue-labeled-implement.yml for manual label).

name: Trigger Lifecycle Implement

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: string
  repository_dispatch:
    types: [lifecycle-implement]

concurrency:
  group: lifecycle-${{ github.repository }}-${{ github.event.client_payload.issue_number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    uses: VisualsoftUK/org-shared-workflows/.github/workflows/lifecycle-implement.yml@main
    with:
      issue_number: ${{ inputs.issue_number || github.event.client_payload.issue_number }}
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
